<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The second Discussion bot's default face (the "another angle" seat): one raised eyebrow and a sideways smile,
       drawn in white over the bot's own color (the avatar's background). -->
  <defs>
    <radialGradient id="glow" cx="38%" cy="30%" r="70%">
      <stop offset="0" stop-color="#fff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="32" fill="url(#glow)"/>
  <!-- brows: one level, one raised -->
  <path d="M16.5 22.5 L27 23" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <path d="M37 21 Q42.5 15.5 48 19" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <!-- eyes -->
  <ellipse cx="22" cy="30" rx="3.6" ry="4.4" fill="#fff"/>
  <ellipse cx="42" cy="29" rx="3.6" ry="4.8" fill="#fff"/>
  <!-- a sideways, knowing smile -->
  <path d="M24 43 Q33 47.5 41.5 39.5" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>
</svg>
