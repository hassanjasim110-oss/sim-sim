<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The first Discussion bot's default face (the facts & sources seat): round reading glasses and a calm smile,
       drawn in white over the bot's own color (the avatar's background). -->
  <defs>
    <radialGradient id="glow" cx="38%" cy="30%" r="70%">
      <stop offset="0" stop-color="#fff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="32" fill="url(#glow)"/>
  <!-- glasses -->
  <circle cx="22.5" cy="29" r="7.2" fill="none" stroke="#fff" stroke-width="2.6"/>
  <circle cx="41.5" cy="29" r="7.2" fill="none" stroke="#fff" stroke-width="2.6"/>
  <path d="M29.7 28.2 q2.3 -2 4.6 0" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
  <!-- eyes behind the glasses -->
  <circle cx="22.5" cy="29.5" r="2.6" fill="#fff"/>
  <circle cx="41.5" cy="29.5" r="2.6" fill="#fff"/>
  <!-- a calm, small smile -->
  <path d="M25.5 43.5 Q32 47.5 38.5 43.5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
</svg>
