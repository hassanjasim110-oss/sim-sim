<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Sim Sim's default face: a calm, friendly face drawn over the theme's own color (the avatar's background). -->
  <defs>
    <radialGradient id="glow" cx="38%" cy="30%" r="70%">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="32" fill="url(#glow)"/>
  <!-- eyes -->
  <ellipse cx="23" cy="28" rx="4.2" ry="5.4" fill="#fff"/>
  <ellipse cx="41" cy="28" rx="4.2" ry="5.4" fill="#fff"/>
  <!-- cheeks -->
  <circle cx="16.5" cy="38" r="3.2" fill="#fff" opacity=".22"/>
  <circle cx="47.5" cy="38" r="3.2" fill="#fff" opacity=".22"/>
  <!-- smile -->
  <path d="M22.5 40.5 Q32 48.5 41.5 40.5" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/>
  <!-- a small sound wave: the one who answers when called -->
  <path d="M50.5 15.5 q3 3.5 0 7" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".75"/>
  <path d="M54.5 12.5 q5 6.5 0 13" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".45"/>
</svg>
